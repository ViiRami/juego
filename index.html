<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero Interactivo</title>
  
  <!-- ✍️ TIPOGRAFÍA PASO 1: Si quieres usar otra fuente distinta a Quicksand (ej. Roboto, Montserrat), 
        debes cambiar este enlace de Google Fonts por el de tu nueva fuente. -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* 🎨 COLORES PRINCIPALES DEL JUEGO */
      /* Cambia el código HEX (#) por el que prefieras */
      --btn-color: #c0e0d0;   /* 🎨 Color de fondo del botón principal y bordes de opciones */
      --btn-hover: #99b3a6;   /* 🎨 Color del botón al pasar el mouse por encima */
      --text-color: #837456;  /* 🎨 Color general de los textos en todo el juego */
      
      --dice-size: 120px;
      --half: calc(var(--dice-size) / 2);
    }

    body {
      margin: 0;
      padding: 20px;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      
      /* 🎨 FONDO DEL JUEGO: Actualmente es transparente para que se vea el fondo de InDesign */
      background-color: transparent; 
      
      color: var(--text-color);
      
      /* ✍️ TIPOGRAFÍA PASO 2: Escribe aquí el nombre de tu tipografía (debe coincidir con la de Google Fonts) */
      font-family: 'Quicksand', Arial, Helvetica, sans-serif;
      
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: flex-start;
      gap: 1px; /* 👈 Espacio reducido al mínimo para pegar más el panel del dado al tablero */
      overflow: hidden; 
    }

    /* =========================================
       PANEL DEL DADO 
       ========================================= */
    .dice-panel {
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      text-align: center;
      
      /* 🎨 FONDO DEL PANEL DEL DADO (La cajita donde está el dado) */
      background: #fff3e4; 
      
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      z-index: 20;
    }

    h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }
    
    /* =========================================
       EL DADO (CARAS Y PUNTOS)
       ========================================= */
    .stage { height: 180px; width: 180px; display: grid; place-items: center; perspective: 900px; cursor: pointer; }
    .die { position: relative; width: var(--dice-size); height: var(--dice-size); transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(.14,.78,.21,1); }
    
    .face { 
      position: absolute; 
      inset: 0; 
      
      /* 🎨 COLOR DEL BORDE DEL DADO (Actualmente gris claro) */
      border: 2px solid #ebb3b7; 
      
      border-radius: 19%; 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      padding: 17%; 
      
      /* 🎨 COLOR DE FONDO DE LAS CARAS DEL DADO (Actualmente blanco) */
      background: #778c78; 
      
      /* 🎨 COLOR DE LA SOMBRA INTERIOR DEL DADO (Para darle volumen) */
      box-shadow: inset -5px -5px 10px #aaa9a926; 
      
      backface-visibility: hidden; 
    }
    
    .face[data-n="1"] { transform: translateZ(var(--half)); }
    .face[data-n="6"] { transform: rotateY(180deg) translateZ(var(--half)); }
    .face[data-n="3"] { transform: rotateY(90deg) translateZ(var(--half)); }
    .face[data-n="4"] { transform: rotateY(-90deg) translateZ(var(--half)); }
    .face[data-n="2"] { transform: rotateX(90deg) translateZ(var(--half)); }
    .face[data-n="5"] { transform: rotateX(-90deg) translateZ(var(--half)); }
    
    .pip { 
      width: 70%; 
      height: 70%; 
      border-radius: 50%; 
      align-self: center; 
      justify-self: center; 
      
      /* 🎨 COLOR DE LOS PUNTOS DEL DADO (Actualmente gris oscuro) */
      background: #fff3e4; 
    }
    
    /* =========================================
       BOTÓN "LANZAR DADO"
       ========================================= */
    .roll-button { 
      /* El fondo ya toma el color de --btn-color */
      background: var(--btn-color); 
      
      /* 🎨 COLOR DEL TEXTO DENTRO DEL BOTÓN (Actualmente blanco) */
      color: #837456; 
      
      /* ✍️ TIPOGRAFÍA DEL BOTÓN */
      font-family: 'Quicksand', sans-serif; 
      
      font-weight: 700; font-size: 1.1rem; border: none; border-radius: 50px; padding: 15px 35px; cursor: pointer; transition: background 0.2s, transform 0.1s; 
      
      /* 🎨 COLOR DE LA SOMBRA DEL BOTÓN (Aquí hay un color lila en formato RGBA, si quieres puedes borrar esta línea o poner un tono verde/crema) */
      box-shadow: 0 4px 15px #accabb; 
    }
    .roll-button:hover { background: var(--btn-hover); transform: translateY(-3px); }
    .roll-button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .board-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .board-inner {
      position: relative;
      display: inline-block;
    }

    .board-img {
      display: block;
      max-width: 100%;
      max-height: 90vh; 
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .token {
      position: absolute;
      width: 18%; 
      aspect-ratio: 1 / 1;
      background: url('conejo.png') no-repeat center/contain;
      transform: translate(-50%, -50%); 
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }

    /* =========================================
       VENTANAS EMERGENTES (MODALES DE PREGUNTAS)
       ========================================= */
    #modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      
      /* 🎨 COLOR DEL FONDO OSCURO QUE TAPA EL JUEGO AL SALIR UNA PREGUNTA */
      background: #fff3e4;
      
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100; 
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      /* 🎨 FONDO DE LA TARJETA EN DEGRADADO (Puedes cambiar los colores HEX aquí) */
      background: linear-gradient(135deg, #fff3e4 0%, #d8ebd0 100%); 
      
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      text-align: center;
      display: none; 
      flex-direction: column;
      gap: 20px;
    }
    .modal-box.active {
      display: flex; 
    }

    .question-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .options-container { display: flex; flex-direction: column; gap: 12px; }
    
    /* BOTONES DE RESPUESTA (OPCIONES A, B, C) */
    .option-btn {
      /* 🎨 COLOR DE FONDO DEL BOTÓN DE RESPUESTA */
      background: #9bac92; 
      
      /* El borde y el texto toman los colores de --btn-color y --text-color definidos arriba */
      border: 2px solid var(--btn-color);
      color: var(--text-color);
      
      /* ✍️ TIPOGRAFÍA DE LOS BOTONES DE RESPUESTA */
      font-family: 'Quicksand', sans-serif; 
      
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    /* COLOR CUANDO EL MOUSE PASA POR ENCIMA DE UNA OPCIÓN */
    .option-btn:hover { 
      background: var(--btn-color); 
      color: #6d7866; 
    }

    .feedback-img {
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      object-fit: contain;
      max-height: 350px;
    }
  </style>
</head>
<body>

  <!-- ===============================
       EL JUEGO NORMAL
       =============================== -->
  <div class="dice-panel">
    <h1>¡Lanza el dado!</h1>
    <div class="stage" id="stage">
      <div class="die" id="die"></div>
    </div>
    <button class="roll-button" id="roll" type="button">Lanzar dado</button>
    <div id="result" style="font-size: 1.2rem; margin-top: 10px;"><strong>Resultado:</strong> <span id="res-num">-</span></div>
  </div>

  <div class="board-wrapper">
    <div class="board-inner" id="board">
      <img src="index.png" class="board-img" alt="Tablero">
      <div class="token" id="token"></div>
    </div>
  </div>

  <!-- ===============================
       CAPA DE LAS TARJETAS (MODAL)
       =============================== -->
  <div id="modal-overlay">
    
    <div id="question-modal" class="modal-box">
      <h2 id="question-text" class="question-title">¿Pregunta de ejemplo?</h2>
      <div id="options-container" class="options-container">
      </div>
    </div>

    <div id="feedback-modal" class="modal-box">
      <img id="feedback-image" src="" alt="Resultado" class="feedback-img">
      <button id="btn-continue" class="roll-button">Continuar jugando</button>
    </div>

  </div>

  <script>
    // 1. GENERAR EL DADO
    const die = document.getElementById('die');
    const patterns = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
    for (let n=1; n<=6; n++) {
      const face = document.createElement('div');
      face.className = 'face'; face.dataset.n = n;
      for (let i=0; i<9; i++) {
        const cell = document.createElement('div');
        if (patterns[n].includes(i)) cell.className = 'pip';
        face.appendChild(cell);
      }
      die.appendChild(face);
    }

    // ==========================================
    // 2. DATOS DEL TABLERO Y LAS PREGUNTAS
    // (Aquí puedes configurar 'modalBg' usando degradados tipo 'linear-gradient(...)' o colores planos por cada pregunta)
    // ==========================================
    const pathCoordinates = [
      { x: 1028, y: 3256 }, { x: 1298, y: 3123 }, { x: 1765, y: 3082 },
      { x: 1517, y: 2861 }, { x: 1017, y: 3025 }, { x: 717,  y: 2828 },
      { x: 1085, y: 2639 }, { x: 1594, y: 2725 }, { x: 1802, y: 2558 },
      { x: 1523, y: 2442 }, { x: 1103, y: 2453 }, { x: 755,  y: 2443 } 
    ];

    const questionsData = [
      null, // Casilla 0: (Punto de partida) No pasa nada.
      
      // Casilla 1: 
      { 
        pregunta: "¿Qué características hacen que los peces sean útiles para la investigación?", 
        opciones: ["Son animales de gran tamaño, vidas muy largas y costosos de mantener.", "Son pequeños, tienen vidas cortas, ponen huevos transparentes y ayudan a estudiar la regeneración cardíaca.", "Su sistema circulatorio es idéntico al de los mamíferos terrestres y no se pueden reproducir en laboratorios."], 
        correctIndex: 1,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #c0e0d1 100%)", // 🎨 Degradado personalizado para esta pregunta
        textColor: "#837456", 
        btnBg: "#accabb"      
      }, 
      
      // Casilla 2:
      { 
        pregunta: "¿Qué prohíbe estrictamente la Ley 2047 de 2020 en Colombia respecto a los productos cosméticos?", 
        opciones: ["La prohibición total de fabricar cualquier tipo de medicamento o vacuna utilizando animales.", "Únicamente la comercialización de productos importados desde el continente africano.", "Realizar ensayos en animales de productos cosméticos terminados, ingredientes o mezclas, así como importar, fabricar o comercializarlos."], 
        correctIndex: 2,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #778c78 100%)",
        textColor: "#fff3e4",
        btnBg: "#778c78"
      }, 
      
      { 
        pregunta: "¿Cuáles son algunos de los sellos oficiales internacionalmente reconocidos que debes buscar?", 
        opciones: ["Peta, Leaping Bunny, Cruelty Free Europe y el sello de Te Protejo.", "Cualquier logotipo que tenga la silueta de un perro o un gato impreso en color negro.", "El sello de calidad ISO 9001, marcas de origen nacional y etiquetas de precio ecológico."], 
        correctIndex: 0,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #ebb3b7 100%)",
        textColor: "#837456",
        btnBg: "#d4a1a5"
      }, 
      
      // Casilla 4:
      { 
        pregunta: "Dentro de las alternativas éticas que reemplazan el uso de animales, ¿a qué hace referencia el método In Silico?", 
        opciones: ["A modelos computacionales y simulaciones por software.", "A cultivos celulares humanos en placas de laboratorio.", "A un ensayo visual realizado en membranas corioalantoideas."], 
        correctIndex: 0,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #837456 100%)",
        textColor: "#fff3e4",
        btnBg: "#695d45"
      }, 
      
      { 
        pregunta: "Para verificar de forma segura si una marca de cosméticos o cuidado personal es realmente cruelty-free:", 
        opciones: ["Confiar únicamente en la publicidad de televisión y redes sociales.", "Revisar que el empaque sea de color verde pastel.", "Utilizar buscadores oficiales como Te Protejo o Peta."], 
        correctIndex: 2,
         modalBg: "linear-gradient(135deg, #fff3e4 0%, #c0e0d1 100%)", // 🎨 Degradado personalizado para esta pregunta
        textColor: "#837456", 
        btnBg: "#accabb"
      }, // Casilla 5
      { 
        pregunta: "¿A qué tipo de prueba de laboratorio son expuestos los peces?", 
        opciones: ["Pruebas de toxicidad ambiental.", "Pruebas de resistencia textil.", "Ensayos exclusivos de nutrición marina."], 
        correctIndex: 0,
       modalBg: "linear-gradient(135deg, #fff3e4 0%, #778c78 100%)",
        textColor: "#fff3e4",
        btnBg: "#778c78"
      }, // Casilla 6
      { 
        pregunta: "¿Qué implican el procedimiento de modificación genética e inyección en embriones?", 
        opciones: ["Modificar la dieta diaria de los peces en estanques comerciales.", "Alterar el material genético e introducir sustancias o vectores en las etapas embrionarias tempranas.", "Evaluar únicamente el crecimiento físico de los peces en agua dulce."], 
        correctIndex: 1,
      modalBg: "linear-gradient(135deg, #fff3e4 0%, #ebb3b7 100%)",
        textColor: "#837456",
        btnBg: "#d4a1a5"
      }, // Casilla 7
      { 
        pregunta: "¿Qué evalúan generalmente los procedimientos de toxicidad subcrónica y crónica en animales?", 
        opciones: ["Los efectos adversos provocados por la exposición prolongada o repetida a una sustancia durante gran parte de su ciclo de vida.", "La velocidad con la que pueden correr en superficies planas.", "La cantidad de alimento que consumen al día sin alterar su peso."], 
        correctIndex: 0,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #837456 100%)",
        textColor: "#fff3e4",
        btnBg: "#695d45"
      }, // Casilla 8
      { 
        pregunta: "¿Por qué es importante compartir información cruelty-free?", 
        opciones: ["Reemplazar por completo la necesidad de tener sellos oficiales en los empaques.", "Vender productos de maquillaje importado de forma directa.", "Fomentar la educación, concientizar a más jóvenes sobre la Ley 2047 y promover el uso de alternativas libres de crueldad."], 
        correctIndex: 2,
       modalBg: "linear-gradient(135deg, #fff3e4 0%, #c0e0d1 100%)", // 🎨 Degradado personalizado para esta pregunta
        textColor: "#837456", 
        btnBg: "#accabb"
      }, // Casilla 9
      { 
        pregunta: "¿Qué aspecto fundamental estableció la Ley 84 de 1989 en Colombia?", 
        opciones: ["La creación de multas exclusivamente para zoológicos y circos ambulantes.", "Que los animales pasaron a tener en todo el territorio nacional especial protección contra el sufrimiento y el dolor causados por el hombre.", "La prohibición inmediata de importar cosméticos de Europa y Asia."], 
        correctIndex: 1,
         modalBg: "linear-gradient(135deg, #fff3e4 0%, #778c78 100%)",
        textColor: "#fff3e4",
        btnBg: "#778c78"
      }, // Casilla 10
      { 
        pregunta: "¿Qué cambio histórico introdujo la Ley 1774 de 2016?", 
        opciones: ["Los reconoció legalmente como seres sintientes, estableciendo penas de prisión para castigar los actos de crueldad y maltrato.", "Autorizó el uso de animales en laboratorios de cosmética bajo supervisión policial.", "Los catalogó estrictamente como bienes muebles de propiedad familiar."], 
        correctIndex: 0,
        modalBg: "linear-gradient(135deg, #fff3e4 0%, #ebb3b7 100%)",
        textColor: "#837456",
        btnBg: "#d4a1a5"
      },   // Casilla 11 (Final)
    ];

    let currentPosition = 0;
    const token = document.getElementById('token');
    const rollButton = document.getElementById('roll');

    const ajusteX = 633; 
    const ajusteY = 2349; 
    const anchoImagen = 1254;
    const altoImagen = 1000;

    function updateTokenPosition() {
      const xPercent = ((pathCoordinates[currentPosition].x - ajusteX) / anchoImagen) * 100;
      const yPercent = ((pathCoordinates[currentPosition].y - ajusteY) / altoImagen) * 100;
      token.style.left = xPercent + '%';
      token.style.top = yPercent + '%';
    }
    
    updateTokenPosition();

    // ==========================================
    // 3. LÓGICA DE LAS TARJETAS (MODALES)
    // ==========================================
    const modalOverlay = document.getElementById('modal-overlay');
    const questionModal = document.getElementById('question-modal');
    const feedbackModal = document.getElementById('feedback-modal');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackImage = document.getElementById('feedback-image');
    const btnContinue = document.getElementById('btn-continue');

    function checkCurrentSquare() {
      const currentQuestion = questionsData[currentPosition];
      
      if (currentQuestion) {
        showQuestion(currentQuestion);
      } else {
        rolling = false;
        rollButton.disabled = false;
        if (currentPosition === pathCoordinates.length - 1) { rollButton.innerText = "Volver a jugar"; }
      }
    }

    function showQuestion(qData) {
      optionsContainer.innerHTML = '';
      questionText.innerText = qData.pregunta;

      // Aplicar el degradado y colores personalizados definidos en el objeto de la pregunta actual
      const currentModalBg = qData.modalBg || 'linear-gradient(135deg, #fff3e4 0%, #d8ebd0 100%)';
      const currentTextColor = qData.textColor || '#837456';
      const currentBtnBg = qData.btnBg || '#9bac92';

      questionModal.style.background = currentModalBg;
      questionModal.style.color = currentTextColor;

      qData.opciones.forEach((opcionText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opcionText;
        btn.style.background = currentBtnBg;
        btn.style.color = currentTextColor;
        
        btn.onclick = () => {
          if (index === qData.correctIndex) {
            showFeedback('tarjeta_Correcto.png', currentModalBg, currentTextColor);
          } else {
            showFeedback('tarjeta_Incorrecto.png', currentModalBg, currentTextColor);
          }
        };
        optionsContainer.appendChild(btn);
      });

      questionModal.classList.add('active');
      feedbackModal.classList.remove('active');
      modalOverlay.classList.add('active');
    }

    function showFeedback(imageName, modalBgColor, modalTextColor) {
      questionModal.classList.remove('active');
      feedbackModal.style.background = modalBgColor;
      feedbackModal.style.color = modalTextColor;
      feedbackModal.classList.add('active');
      feedbackImage.src = imageName;
    }

    btnContinue.onclick = () => {
      modalOverlay.classList.remove('active');
      rolling = false;
      rollButton.disabled = false;
      if (currentPosition === pathCoordinates.length - 1) { rollButton.innerText = "Volver a jugar"; }
    };

    // ==========================================
    // 4. LÓGICA DEL JUEGO Y LANZAMIENTO
    // ==========================================
    const angles = {1:[0,0], 2:[270,0], 3:[0,270], 4:[0,90], 5:[90,0], 6:[0,180]};
    let last = 1, xTurns = 0, yTurns = 0, rolling = false;

    function roll() {
      if (rolling) return;
      
      if (currentPosition >= pathCoordinates.length - 1) {
        currentPosition = 0;
        updateTokenPosition();
        document.getElementById('res-num').innerText = "-";
        rollButton.innerText = "Lanzar dado";
        return; 
      }

      rolling = true; 
      rollButton.disabled = true;

      let next = Math.floor(Math.random() * 5) + 1;
      if (next >= last) next++;
      const [x, y] = angles[next];
      xTurns += 2 + Math.floor(Math.random()*2);
      yTurns += 2 + Math.floor(Math.random()*2);
      
      die.style.transform = `rotateX(${xTurns*360 + x}deg) rotateY(${yTurns*360 + y}deg)`;

      const onTransition = (e) => {
        if (e.propertyName === 'transform') {
          die.removeEventListener('transitionend', onTransition);
          last = next;
          document.getElementById('res-num').innerText = last;
          
          currentPosition += last;
          
          if (currentPosition >= pathCoordinates.length) {
            currentPosition = pathCoordinates.length - 1; 
          }
          
          updateTokenPosition();

          setTimeout(() => {
            checkCurrentSquare();
          }, 600);
        }
      };
      
      die.addEventListener('transitionend', onTransition);
    }

    rollButton.addEventListener('click', roll);
    document.getElementById('stage').addEventListener('click', roll);
  </script>
</body>
</html>
