<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero Interactivo</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --btn-color: #BD95E8;
      --btn-hover: #a87cd5;
      --text-color: #292d31;
      --dice-size: 120px;
      --half: calc(var(--dice-size) / 2);
    }

    /* EL CUERPO OCUPA EL 100% DEL MARCO Y ES TRANSPARENTE */
    body {
      margin: 0;
      padding: 20px;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      background-color: transparent; /* Fondo completamente transparente */
      color: var(--text-color);
      font-family: 'Quicksand', Arial, Helvetica, sans-serif;
      
      /* Distribución: Dado a la izquierda, tablero a la derecha */
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: space-between;
      overflow: hidden; /* Evita que salgan barras de scroll en InDesign */
    }

    /* PANEL DEL DADO (A LA IZQUIERDA) */
    .dice-panel {
      flex: 0 0 250px; /* Ancho fijo para el panel del dado */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      /* Fondo semi-transparente muy suave para que el texto se lea si hay algo detrás en InDesign */
      background: rgba(255, 255, 255, 0.6); 
      padding: 30px;
      border-radius: 20px;
      z-index: 20;
    }

    h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }
    
    .stage { height: 180px; width: 180px; display: grid; place-items: center; perspective: 900px; cursor: pointer; }
    .die { position: relative; width: var(--dice-size); height: var(--dice-size); transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(.14,.78,.21,1); }
    .face { position: absolute; inset: 0; border: 2px solid #d8d9da; border-radius: 19%; display: grid; grid-template-columns: repeat(3, 1fr); padding: 17%; background: #fff; box-shadow: inset -5px -5px 10px #aaa9a926; backface-visibility: hidden; }
    
    .face[data-n="1"] { transform: translateZ(var(--half)); }
    .face[data-n="6"] { transform: rotateY(180deg) translateZ(var(--half)); }
    .face[data-n="3"] { transform: rotateY(90deg) translateZ(var(--half)); }
    .face[data-n="4"] { transform: rotateY(-90deg) translateZ(var(--half)); }
    .face[data-n="2"] { transform: rotateX(90deg) translateZ(var(--half)); }
    .face[data-n="5"] { transform: rotateX(-90deg) translateZ(var(--half)); }
    
    .pip { width: 70%; height: 70%; border-radius: 50%; align-self: center; justify-self: center; background: #5b6065; }
    
    .roll-button { background: var(--btn-color); color: white; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.1rem; border: none; border-radius: 50px; padding: 15px 35px; cursor: pointer; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 15px rgba(189, 149, 232, 0.4); }
    .roll-button:hover { background: var(--btn-hover); transform: translateY(-3px); }
    .roll-button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* CONTENEDOR FLEXIBLE PARA EL TABLERO (A LA DERECHA) */
    .board-wrapper {
      flex: 1; /* Toma todo el espacio sobrante a la derecha */
      height: 100%; /* Toma el 100% de la altura de la pantalla/marco */
      display: flex;
      justify-content: center;
      align-items: center;
      padding-left: 20px;
    }

    /* EL TABLERO INTERNO CON PROPORCIÓN EXACTA CERO DEFORMACIÓN */
    .board-inner {
      position: relative;
      height: 100%; /* Ajusta la altura al máximo permitido por el marco de InDesign */
      max-width: 100%; 
      aspect-ratio: 1920 / 4000; /* Obliga a mantener las medidas de tu imagen */
    }

    /* IMAGEN DEL TABLERO */
    .board-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain; /* Nunca se deforma */
    }

    /* LA FICHA (CONEJO MÁS GRANDE) */
    .token {
      position: absolute;
      width: 20%; /* ¡El doble de grande que antes! Si lo quieres aún más grande cambia este número a 25% */
      aspect-ratio: 1 / 1;
      background: url('conejo.png') no-repeat center/contain;
      transform: translate(-50%, -50%); 
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Panel del Dado (Izquierda) -->
  <div class="dice-panel">
    <h1>¡Lanza el dado!</h1>
    <div class="stage" id="stage">
      <div class="die" id="die"></div>
    </div>
    <button class="roll-button" id="roll" type="button">Lanzar dado</button>
    <div id="result" style="font-size: 1.2rem; margin-top: 10px;"><strong>Resultado:</strong> <span id="res-num">-</span></div>
  </div>

  <!-- Tablero (Derecha) -->
  <div class="board-wrapper">
    <div class="board-inner" id="board">
      <!-- Insertamos el tablero como imagen real para evitar que CSS lo deforme -->
      <img src="index.png" class="board-img" alt="Tablero de juego">
      <!-- Ficha del conejo -->
      <div class="token" id="token"></div>
    </div>
  </div>

  <script>
    // 1. GENERAR EL DADO
    const die = document.getElementById('die');
    const patterns = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
    for (let n=1; n<=6; n++) {
      const face = document.createElement('div');
      face.className = 'face'; face.dataset.n = n;
      for (let i=0; i<9; i++) {
        const cell = document.createElement('div');
        if (patterns[n].includes(i)) cell.className = 'pip';
        face.appendChild(cell);
      }
      die.appendChild(face);
    }

    // 2. COORDENADAS EXACTAS
    const pathCoordinates = [
      { x: 1028, y: 3256 },
      { x: 1298, y: 3123 },
      { x: 1765, y: 3082 },
      { x: 1517, y: 2861 },
      { x: 1017, y: 3025 },
      { x: 717,  y: 2828 },
      { x: 1085, y: 2639 },
      { x: 1594, y: 2725 },
      { x: 1802, y: 2558 },
      { x: 1523, y: 2442 },
      { x: 1103, y: 2453 },
      { x: 755,  y: 2443 }
    ];

    let currentPosition = 0;
    const token = document.getElementById('token');

    // CONVERTIR COORDENADAS EN PORCENTAJES SOBRE EL NUEVO MARCO
    function moveTokenToIndex(index) {
      const boardWidth = 1920;
      const boardHeight = 4000;
      
      const xPercent = (pathCoordinates[index].x / boardWidth) * 100;
      const yPercent = (pathCoordinates[index].y / boardHeight) * 100;

      token.style.left = xPercent + '%';
      token.style.top = yPercent + '%';
    }

    // Ubica al conejo al iniciar
    moveTokenToIndex(0);

    // 3. LÓGICA DEL DADO
    const angles = {1:[0,0], 2:[270,0], 3:[0,270], 4:[0,90], 5:[90,0], 6:[0,180]};
    let last = 1, xTurns = 0, yTurns = 0, rolling = false;

    function roll() {
      if (rolling) return;
      
      // Reinicio
      if (currentPosition >= pathCoordinates.length - 1) {
        currentPosition = 0;
        moveTokenToIndex(0);
        document.getElementById('res-num').innerText = "-";
        document.getElementById('roll').innerText = "Lanzar dado";
        return; 
      }

      rolling = true; 
      document.getElementById('roll').disabled = true;

      let next = Math.floor(Math.random() * 5) + 1;
      if (next >= last) next++;
      const [x, y] = angles[next];
      xTurns += 2 + Math.floor(Math.random()*2);
      yTurns += 2 + Math.floor(Math.random()*2);
      
      die.style.transform = `rotateX(${xTurns*360 + x}deg) rotateY(${yTurns*360 + y}deg)`;

      const onTransition = (e) => {
        if (e.propertyName === 'transform') {
          die.removeEventListener('transitionend', onTransition);
          last = next;
          document.getElementById('res-num').innerText = last;
          
          currentPosition += last;
          
          if (currentPosition >= pathCoordinates.length) {
            currentPosition = pathCoordinates.length - 1; 
          }
          
          moveTokenToIndex(currentPosition);

          if (currentPosition === pathCoordinates.length - 1) {
             document.getElementById('roll').innerText = "Volver a jugar";
          }

          rolling = false;
          document.getElementById('roll').disabled = false;
        }
      };
      
      die.addEventListener('transitionend', onTransition);
    }

    document.getElementById('roll').addEventListener('click', roll);
    document.getElementById('stage').addEventListener('click', roll);
  </script>
</body>
</html>
